[platformio]
src_dir = src

[env:pro8MHzatmega328]
platform = atmelavr
framework = arduino
board = pro8MHzatmega328

lib_deps =
    EnableInterrupt
    Low-Power
    AskSinPP

build_flags =
    -D SERIALDEBUG
    -D SIMPLE_CC1101_INIT
    -D LED_ENABLED
    -D HIDE_IGNORE_MSG

upload_speed = 57600
monitor_speed = 57600
