[platformio]
src_dir = src
default_envs = pro8MHzatmega328

[env:pro8MHzatmega328]
platform = atmelavr
framework = arduino
board = pro8MHzatmega328

lib_deps =
    EnableInterrupt
    Low-Power
    AskSinPP

build_flags =
    -D SERIALDEBUG
    -D SIMPLE_CC1101_INIT
    -D LED_ENABLED

upload_protocol = arduino
upload_speed = 38400
board_upload.maximum_size = 32256
upload_port = /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_A50285BI-if00-port0
monitor_port = ${env:pro8MHzatmega328.upload_port}
monitor_speed = 57600

; EEPROM bei Upload behalten (kein Chip-Erase): Peers/MasterID/State bleiben erhalten
upload_flags = -D

; ISP ohne Bootloader: Chip-Erase entfernt Optiboot und bei hfuse 0xDE auch EEPROM.
[env:isp]
extends = env:pro8MHzatmega328
board_upload.maximum_size = 32768
upload_protocol = stk500v2
; Pololu: if01 = Programmierport, if03 = TTL-Serial (TX/RX am Programmer)
upload_port = /dev/serial/by-id/usb-Pololu_Corporation_Pololu_USB_AVR_Programmer_v2.1_00513563-if01
monitor_port = /dev/serial/by-id/usb-Pololu_Corporation_Pololu_USB_AVR_Programmer_v2.1_00513563-if03
; -P wird auch fuer "fuses" gebraucht (dort wird upload_port nicht uebergeben)
; -u: kein Safemode (hat beim ersten Versuch die lfuse veraendert)
upload_flags =
    -B20
    -u
    -P/dev/serial/by-id/usb-Pololu_Corporation_Pololu_USB_AVR_Programmer_v2.1_00513563-if01
; EEPROM bleibt beim Chip-Erase nur mit gesetzter EESAVE-Fuse (z.B. hfuse 0xD7) erhalten.
upload_command = $PROJECT_PACKAGES_DIR/tool-avrdude/avrdude -C $PROJECT_PACKAGES_DIR/tool-avrdude/avrdude.conf -c stk500v2 -p atmega328p -B20 -e -u -P $UPLOAD_PORT -U flash:w:$SOURCE:i
; Fuses (nur mit bestuecktem 8-MHz-Quarz!): Quarz, EESAVE, BOD 2,7 V, kein Bootloader
board_fuses.lfuse = 0xEC
board_fuses.hfuse = 0xD7
board_fuses.efuse = 0xFD
